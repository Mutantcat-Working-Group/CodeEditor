name: Release Packages

on:
  release:
    types:
      - published
  push:
    tags:
      - "v*"
      - "[0-9]*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 1.0.20260922. Leave empty to use version.json."
        required: false

env:
  APP_NAME: CodeEditor
  ASSETS_REPOSITORY: ${{ github.repository }}
  BINARY_NAME: codeeditor
  DISABLE_UPDATE: yes
  GH_REPO_PATH: ${{ github.repository }}
  ORG_NAME: ${{ github.repository_owner }}
  VSCODE_QUALITY: stable

concurrency:
  group: release-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_version: ${{ steps.resolve.outputs.release_version }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      ms_tag: ${{ steps.resolve.outputs.ms_tag }}
      ms_commit: ${{ steps.resolve.outputs.ms_commit }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve version
        id: resolve
        run: |
          EVENT_NAME="${{ github.event_name }}"

          case "${EVENT_NAME}" in
            release)
              RAW_VERSION="${{ github.event.release.tag_name }}"
              # The published tag owns this version, so a rerun of the same
              # release has to keep targeting it instead of rolling on.
              TRIGGER_VERSION="${RAW_VERSION}"
              ;;
            workflow_dispatch)
              # Left blank on purpose, the value falls back to version.json.
              RAW_VERSION="${{ github.event.inputs.version }}"
              TRIGGER_VERSION=""
              ;;
            *)
              RAW_VERSION="${{ github.ref_name }}"
              TRIGGER_VERSION="${RAW_VERSION}"
              ;;
          esac

          if [[ -z "${RAW_VERSION}" || "${RAW_VERSION}" == "null" ]]; then
            RAW_VERSION="$(jq -r '.version // empty' version.json)"
          fi

          # A version is `major.minor.YYYYMMDD`. A tag may carry a `v` prefix
          # and an old iteration may have left a `-1`/`-2` suffix behind; drop
          # both so no release ever ships a suffixed version again.
          normalize_version() {
            local value="${1#v}"
            echo "${value%%-*}"
          }

          VERSION="$(normalize_version "${RAW_VERSION}")"
          TRIGGER_VERSION="$(normalize_version "${TRIGGER_VERSION}")"

          if [[ -z "${VERSION}" ]]; then
            echo "No release version provided" >&2
            exit 1
          fi

          tag_exists() {
            git ls-remote --tags --exit-code origin "refs/tags/${1}" >/dev/null 2>&1
          }

          next_day() {
            # GNU date first, then the BSD variant used on macOS.
            date -d "${1} +1 day" '+%Y%m%d' 2>/dev/null \
              || date -j -v+1d -f '%Y%m%d' "${1}" '+%Y%m%d'
          }

          # Iterating twice in one day used to need `1.0.20260922-1`. Roll the
          # date forward instead, so the same request yields `1.0.20260923`.
          if [[ "${VERSION}" != "${TRIGGER_VERSION}" ]]; then
            case "${VERSION}" in
              *.*.*) ;;
              *)
                echo "Version '${VERSION}' is not major.minor.YYYYMMDD" >&2
                exit 1
                ;;
            esac

            MAJOR="${VERSION%%.*}"
            REST="${VERSION#*.}"
            MINOR="${REST%%.*}"
            DAY="${REST#*.}"

            ROLLED=0
            while tag_exists "${VERSION}" || tag_exists "v${VERSION}"; do
              ROLLED=$(( ROLLED + 1 ))

              if (( ROLLED > 365 )); then
                echo "Could not find a free version within a year of '${RAW_VERSION}'" >&2
                exit 1
              fi

              DAY="$(next_day "${DAY}")"
              VERSION="${MAJOR}.${MINOR}.${DAY}"
            done

            if (( ROLLED > 0 )); then
              echo "Rolled version forward to '${VERSION}'"
            fi
          fi

          # A release may be referred to as either `1.2.3` or `v1.2.3`; reuse
          # whichever tag already exists so assets always land on one release.
          RELEASE_TAG=""
          for CANDIDATE in "v${VERSION}" "${VERSION}"; do
            if tag_exists "${CANDIDATE}"; then
              RELEASE_TAG="${CANDIDATE}"
              break
            fi
          done
          RELEASE_TAG="${RELEASE_TAG:-${VERSION}}"

          echo "release_version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "ms_tag=$(jq -r '.tag' upstream/stable.json)" >> "${GITHUB_OUTPUT}"
          echo "ms_commit=$(jq -r '.commit' upstream/stable.json)" >> "${GITHUB_OUTPUT}"

  linux-compile:
    needs: resolve
    runs-on: ubuntu-22.04
    permissions: {}
    env:
      MS_COMMIT: ${{ needs.resolve.outputs.ms_commit }}
      MS_TAG: ${{ needs.resolve.outputs.ms_tag }}
      OS_NAME: linux
      RELEASE_VERSION: ${{ needs.resolve.outputs.release_version }}
      SHOULD_BUILD: yes
      SHOULD_BUILD_REH: no
      SHOULD_BUILD_REH_WEB: no
      VSCODE_ARCH: x64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup GCC
        uses: egor-tensin/setup-gcc@a2861a8b8538f49cf2850980acccf6b05a1b2ae4 # v2.0
        with:
          version: 10
          platform: x64

      - name: Setup Node.js environment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Setup Python 3
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install libkrb5-dev
        run: sudo apt-get update -y && sudo apt-get install -y libkrb5-dev

      - name: Clone VSCode repo
        run: ./get_repo.sh

      - name: Build
        run: ./build.sh

      - name: Compress vscode artifact
        run: |
          find vscode -type f -not -path "*/node_modules/*" -not -path "vscode/.build/node/*" -not -path "vscode/.git/*" > vscode.txt
          echo "vscode/.build/extensions/node_modules" >> vscode.txt
          echo "vscode/.git" >> vscode.txt
          tar -czf vscode.tar.gz -T vscode.txt

      - name: Upload vscode artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vscode-linux
          path: ./vscode.tar.gz
          retention-days: 7

  linux-package:
    needs:
      - resolve
      - linux-compile
    runs-on: ubuntu-latest
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: X64
            vscode_arch: x64
            npm_arch: x64
            image: vscodium/vscodium-linux-build-agent:focal-x64
          - slug: ARM64
            vscode_arch: arm64
            npm_arch: arm64
            image: vscodium/vscodium-linux-build-agent:focal-arm64
    container:
      image: ${{ matrix.image }}
    env:
      MS_COMMIT: ${{ needs.resolve.outputs.ms_commit }}
      MS_TAG: ${{ needs.resolve.outputs.ms_tag }}
      OS_NAME: linux
      RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
      RELEASE_VERSION: ${{ needs.resolve.outputs.release_version }}
      SHOULD_BUILD_REH: no
      SHOULD_BUILD_REH_WEB: no
      VSCODE_ARCH: ${{ matrix.vscode_arch }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: ./build/linux/deps.sh

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      - name: Download vscode artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vscode-linux

      - name: Build binary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_arch: ${{ matrix.npm_arch }}
        run: ./build/linux/package_bin.sh

      - name: Package binary
        run: tar -czf vscode-bin.tar.gz -C "VSCode-linux-${VSCODE_ARCH}" .

      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vscode-bin-${{ matrix.slug }}
          path: ./vscode-bin.tar.gz
          retention-days: 7

  linux-appimage:
    needs:
      - resolve
      - linux-package
    runs-on: ${{ matrix.runs-on }}
    container: ghcr.io/pkgforge-dev/archlinux:v2026.08.31
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-latest
            arch: x86_64
            slug: X64
          - runs-on: ubuntu-24.04-arm
            arch: aarch64
            slug: ARM64
    env:
      MS_COMMIT: ${{ needs.resolve.outputs.ms_commit }}
      MS_TAG: ${{ needs.resolve.outputs.ms_tag }}
      OS_NAME: linux
      RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
      RELEASE_VERSION: ${{ needs.resolve.outputs.release_version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js environment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Setup jq
        uses: vegardit/gha-setup-jq@fae9c6aa0b21dbe5bd3b77d280cf142e0a0a65b4 # 1.1.0

      - name: Install GH
        run: ./build/linux/install_gh.sh

      - name: Prepare container
        uses: pkgforge-dev/anylinux-setup-action@0964f2258d6c93d1391359978dde081fd8b3c6af # v2

      - name: Download vscode binary artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vscode-bin-${{ matrix.slug }}

      - name: Make AppImage
        run: ./build/linux/anylinux-appimage/build.sh

      - name: Prepare assets
        run: ./build/linux/anylinux-appimage/prepare_assets.sh

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./release.sh

  windows-compile:
    needs: resolve
    runs-on: windows-2022
    permissions: {}
    defaults:
      run:
        shell: bash
    env:
      MS_COMMIT: ${{ needs.resolve.outputs.ms_commit }}
      MS_TAG: ${{ needs.resolve.outputs.ms_tag }}
      OS_NAME: windows
      RELEASE_VERSION: ${{ needs.resolve.outputs.release_version }}
      SHOULD_BUILD: yes
      SHOULD_BUILD_REH: no
      SHOULD_BUILD_REH_WEB: no
      VSCODE_ARCH: x64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js environment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Setup Python 3
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Clone VSCode repo
        run: ./get_repo.sh

      - name: Build
        run: ./build.sh

      - name: Compress vscode artifact
        run: |
          find vscode -type f -not -path "*/node_modules/*" -not -path "vscode/.build/node/*" -not -path "vscode/.git/*" > vscode.txt
          echo "vscode/.build/extensions/node_modules" >> vscode.txt
          echo "vscode/.git" >> vscode.txt
          tar -czf vscode.tar.gz -T vscode.txt

      - name: Upload vscode artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vscode-windows
          path: ./vscode.tar.gz
          retention-days: 7

  windows-package:
    needs:
      - resolve
      - windows-compile
    runs-on: windows-2022
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        vscode_arch:
          - x64
          - arm64
    env:
      MS_COMMIT: ${{ needs.resolve.outputs.ms_commit }}
      MS_TAG: ${{ needs.resolve.outputs.ms_tag }}
      OS_NAME: windows
      RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
      RELEASE_VERSION: ${{ needs.resolve.outputs.release_version }}
      SHOULD_BUILD_REH: no
      SHOULD_BUILD_REH_WEB: no
      VSCODE_ARCH: ${{ matrix.vscode_arch }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js environment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Setup Python 3
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Download vscode artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vscode-windows

      - name: Build Windows package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_arch: ${{ matrix.vscode_arch }}
          npm_config_target_arch: ${{ matrix.vscode_arch }}
        run: ./build/windows/package.sh

      - name: Build NSIS installer
        run: ./build/windows/nsis/build.sh

      - name: Prepare checksums
        run: ./prepare_checksums.sh

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./release.sh

  macos-build:
    needs: resolve
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            vscode_arch: x64
          - runner: macos-14
            vscode_arch: arm64
    env:
      MAX_OLD_SPACE_SIZE: 12288
      MS_COMMIT: ${{ needs.resolve.outputs.ms_commit }}
      MS_TAG: ${{ needs.resolve.outputs.ms_tag }}
      OS_NAME: osx
      RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
      RELEASE_VERSION: ${{ needs.resolve.outputs.release_version }}
      SHOULD_BUILD: yes
      SHOULD_BUILD_DMG: yes
      SHOULD_BUILD_REH: no
      SHOULD_BUILD_REH_WEB: no
      VSCODE_ARCH: ${{ matrix.vscode_arch }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js environment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Setup Python 3
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
        if: matrix.vscode_arch == 'x64'

      - name: Clone VSCode repo
        run: ./get_repo.sh

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./build.sh

      - name: Prepare assets
        env:
          SHOULD_BUILD_CLI: no
          SHOULD_BUILD_ZIP: no
        run: ./prepare_assets.sh

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./release.sh
